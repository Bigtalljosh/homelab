services:

# Radarr
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    labels:
      - org.hotio.pullio.update=${PULLIO_UPDATE}
      - org.hotio.pullio.notify=${PULLIO_NOTIFY}
      - org.hotio.pullio.discord.webhook=${PULLIO_DISCORD_WEBHOOK}
    ports:
      - 7878:7878
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/data

# Sonarr
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    labels:
      - org.hotio.pullio.update=${PULLIO_UPDATE}
      - org.hotio.pullio.notify=${PULLIO_NOTIFY}
      - org.hotio.pullio.discord.webhook=${PULLIO_DISCORD_WEBHOOK}
    ports:
      - 8989:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/data

# Bazarr
  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:nightly
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    labels:
      - org.hotio.pullio.update=${PULLIO_UPDATE}
      - org.hotio.pullio.notify=${PULLIO_NOTIFY}
      - org.hotio.pullio.discord.webhook=${PULLIO_DISCORD_WEBHOOK}
    ports:
      - 6767:6767
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/bazarr:/config
      - ${DOCKERSTORAGEDIR}/media:/data/media

  # prowlarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # Torrent client
  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8090
    volumes:
      - ${DOCKERCONFDIR}/qbittorrent:/config
      - ${DOCKERSTORAGEDIR}/torrents:/data/torrents:rw
    ports:
      - 8090:8090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  # SABnzbd
  sabnzbd:
      container_name: sabnzbd
      image: hotio/sabnzbd:latest
      restart: unless-stopped
      logging:
        driver: json-file
        options:
          max-file: ${DOCKERLOGGING_MAXFILE}
          max-size: ${DOCKERLOGGING_MAXSIZE}
      labels:
        - org.hotio.pullio.update=${PULLIO_UPDATE}
        - org.hotio.pullio.notify=${PULLIO_NOTIFY}
        - org.hotio.pullio.discord.webhook=${PULLIO_DISCORD_WEBHOOK}
      environment:
        - PUID=${PUID}
        - PGID=${PGID}
        - TZ=${TZ}
      ports:
      - 8080:8080
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - ${DOCKERCONFDIR}/sabnzbd:/config
        - ${DOCKERSTORAGEDIR}/usenet:/data/usenet:rw

# Plex
  plex:
    container_name: plex
    image: ghcr.io/hotio/plex
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    labels:
      - org.hotio.pullio.update=${PULLIO_UPDATE}
      - org.hotio.pullio.notify=${PULLIO_NOTIFY}
      - org.hotio.pullio.discord.webhook=${PULLIO_DISCORD_WEBHOOK}
    ports:
      - 32400:32400
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - PLEX_CLAIM_TOKEN=${PLEX_CLAIM_TOKEN}
      - PLEX_ADVERTISE_URL=${PLEX_ADVERTISE_URL}
      - PLEX_NO_AUTH_NETWORKS=
      - PLEX_BETA_INSTALL=${PLEX_BETA_INSTALL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/plex:/config:rw
      - ${DOCKERSTORAGEDIR}/media:/data/media:rw
    devices:                                        # UGREEN AMD Ryzen + Radeon: VAAPI hardware transcoding (Plex Pass)
      - /dev/dri:/dev/dri                           # passes the Radeon iGPU through for HW transcode
    group_add:                                      # grant access to the GPU device groups (UGOS host GIDs)
      - "105"                                       # render group -> /dev/dri/renderD128 (VAAPI)
      - "44"                                        # video group  -> /dev/dri/card0
    tmpfs:                                          # transcode in RAM (UGREEN has plenty); remove if low on memory
      - /transcode

  #Transcode media lib from h264 to h265 to drastically reduce storage space
  # tdarr = server/UI only (internalNode=false). Actual transcoding is done by tdarr-node below.
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8265:8265 # webUI port
      - 8266:8266 # server port
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - serverIP=0.0.0.0          # bind on all interfaces so the node can reach the server
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false        # no built-in node — the dedicated tdarr-node does the work
      - inContainer=true
      - ffmpegVersion=7
    volumes:
      - ${DOCKERCONFDIR}/tdarr/server:/app/server
      - ${DOCKERCONFDIR}/tdarr/configs:/app/configs
      - ${DOCKERCONFDIR}/tdarr/logs:/app/logs
      - ${DOCKERSTORAGEDIR}/media:/media
      - ${DOCKERCONFDIR}/tdarr/transcode_cache:/temp

  # Tdarr node — the worker that actually transcodes (shares the server's network namespace)
  tdarr-node:
    container_name: tdarr-node
    image: ghcr.io/haveagitgat/tdarr_node:latest
    restart: unless-stopped
    network_mode: service:tdarr   # share tdarr's netns → server is reachable on localhost
    depends_on:
      - tdarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - nodeName=UgreenNode
      - serverIP=127.0.0.1        # server is on localhost thanks to the shared netns above
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7           # must match the server's ffmpegVersion
      - nodeType=mapped
    volumes:
      # Paths MUST match the server's mounts (same host path → same /media, /temp) so a
      # "mapped" node resolves file paths identically. Note: no /app/server (server-only).
      - ${DOCKERCONFDIR}/tdarr/configs:/app/configs
      - ${DOCKERCONFDIR}/tdarr/logs:/app/logs
      - ${DOCKERSTORAGEDIR}/media:/media
      - ${DOCKERCONFDIR}/tdarr/transcode_cache:/temp
    devices:                      # UGREEN AMD Radeon iGPU for VAAPI transcoding
      - /dev/dri:/dev/dri
    group_add:                    # grant access to the GPU device groups (UGOS host GIDs)
      - "105"                     # render group -> /dev/dri/renderD128 (VAAPI)
      - "44"                      # video group  -> /dev/dri/card0

  # seerr for media discovery (successor to overseerr; auto-migrates the old config on first boot)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true                      # required: image no longer ships its own init process
    environment:
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      # NOTE: seerr runs hardcoded as UID 1000 and ignores PUID/PGID — this folder MUST be
      # owned 1000:1000 (see ../MIGRATION.md), unlike the rest of the stack.
      - ${DOCKERCONFDIR}/seerr:/app/config
    restart: unless-stopped

  # SuggestArr — auto-requests recommended content via Seerr based on Plex watch history
  suggestarr:
    image: ciuse99/suggestarr:latest
    container_name: suggestarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - SUGGESTARR_PORT=5000
    ports:
      - 5000:5000
    volumes:
      - ${DOCKERCONFDIR}/suggestarr:/app/config/config_files
